name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Verify release title matches tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
        run: |
          if [[ "$RELEASE_NAME" != "$RELEASE_TAG" ]]; then
            echo "Release title must exactly match tag: expected '$RELEASE_TAG', got '$RELEASE_NAME'." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify tag is the current main commit
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD^{commit})" = "$(git rev-parse origin/main^{commit})"

      - name: Set version from tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine cffconvert==2.0.0

      - name: Validate citation metadata
        run: |
          cffconvert --validate
          python .github/scripts/check_release_versions.py \
            --expected-version "$SETUPTOOLS_SCM_PRETEND_VERSION"

      - name: Build package
        run: |
          rm -rf dist
          python -m build

      - name: Verify distribution
        run: python -m twine check dist/*

      - name: Install and execute the built wheel
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install --force-reinstall --no-deps "${wheels[0]}"
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python - <<'PY'
          import os
          from importlib.metadata import version
          import mlmm

          expected = os.environ["SETUPTOOLS_SCM_PRETEND_VERSION"]
          assert version("mlmm-toolkit") == expected
          assert mlmm.__version__ == expected
          PY
          python -m mlmm --version
          mlmm --version

      - name: Attach distribution to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.whl dist/*.tar.gz --clobber

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

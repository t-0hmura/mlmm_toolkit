name: Pytest

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  optional-dependency-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve CPU-installable optional backends
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[orb,aimnet,mcp]"
          python -m pip check

      - name: Probe optional APIs
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import orb_models
          from aimnet.calculators import AIMNet2ASE, AIMNet2Calculator
          from mlmm.mcp.server import mcp

          assert orb_models is not None
          assert AIMNet2ASE is not None and AIMNet2Calculator is not None
          assert mcp is not None
          for package in ("orb-models", "aimnet", "mcp"):
              print(f"{package}=={version(package)}")
          PY

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install mlmm with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
          pip install click pyyaml numpy biopython scipy ase \
            autograd dask distributed h5py fabric jinja2 joblib \
            matplotlib natsort psutil rmsd sympy scikit-learn \
            pandas tabulate plotly kaleido ParmEd openmm \
            pymsym \
            ipywidgets pytest pytest-cov pytest-timeout
        timeout-minutes: 15

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short -x --timeout=120 --cov=mlmm --cov-report=term-missing --cov-fail-under=20
        timeout-minutes: 10

      - name: Run hessian_ff tests
        run: |
          pytest hessian_ff/tests/ -v --tb=short -x --timeout=120 --cov=hessian_ff --cov-report=term-missing --cov-fail-under=50
        timeout-minutes: 10

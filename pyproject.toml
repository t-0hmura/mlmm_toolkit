[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlmm-toolkit"
description = "mlmm - ML/MM toolkit for enzyme reaction analysis"
readme = "README.md"
authors = [{name = "Takuto Ohmura", email = "ohmura.takuto@gmail.com"}]
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.txt",
    "pysisyphus/LICENSE",
    "thermoanalysis/LICENSE",
]
dynamic = ["version"]
requires-python = ">=3.11,<3.13"
keywords = [
    "computational-chemistry",
    "enzyme",
    "QM/MM",
    "ML/MM",
    "UMA",
    "transition-state",
    "reaction-mechanism",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    # mlmm core dependencies
    "fairchem-core",
    "torch>=2.8,<2.14",
    # hessian_ff JIT-compiles its C++ kernels through torch.utils.cpp_extension,
    # which on torch >= 2.x requires Ninja and no longer has a distutils fallback.
    # The pip `ninja` wheel ships a binary for every platform (incl. linux-aarch64),
    # so depending on it makes a clean-env install build the extensions out of the box.
    "ninja",
    # torch_geometric / torch_scatter are intentionally NOT listed: mlmm never
    # imports them and current fairchem-core does not require them. torch_scatter
    # ships only as an sdist whose setup.py imports torch, which fails under PEP
    # 517 build isolation and breaks a clean `pip install`.
    "numpy>=2.0,<2.5",
    "biopython>=1.80,<2.0",
    "ase>=3.26.0",
    "ParmEd>=4.3.1",
    "pyyaml>=6.0,<7.0",
    "click>=8.1,<9.0",
    "plotly>=6.1.1",
    "kaleido",

    # pysisyphus dependencies (bundled)
    "autograd",
    "dask",
    "distributed",
    "h5py",
    "jinja2",
    "natsort",
    "psutil",
    "rmsd",
    "scipy",
    "sympy",
    "scikit-learn",
    "pyparsing",

    # thermoanalysis dependencies (bundled)
    "pandas",
    "pymsym>=0.3.5,<0.4",
]

[project.optional-dependencies]
orb = [
    # orb-models >=0.6 requires Python >=3.12; 0.5.x is the last 3.11-capable line.
    "orb-models>=0.7.0; python_version >= '3.12'",
    "orb-models>=0.5.5,<0.6; python_version < '3.12'",
]
aimnet = ["aimnet>=0.2.0"]
pdbfixer = ["pdbfixer"]
openmm = ["openmm"]
# NOTE: there is deliberately no `[mace]` extra. `mace-torch` hard-pins
# `e3nn==0.4.4` whereas `fairchem-core` (UMA) needs `e3nn>=0.5`, so the two
# cannot share an env; declaring the extra here would break the default UMA
# install. Put MACE in its own conda env instead: `pip uninstall -y
# fairchem-core && pip install mace-torch` (e.g. in `mlmm-toolkit-mace`).
dft = [
    "pyscf>=2.13.0",
    "gpu4pyscf-cuda12x>=1.7.0; platform_machine == 'x86_64'",
    "cupy-cuda12x>=13.0,!=13.4.0; platform_machine == 'x86_64'",
    "basis-set-exchange>=0.11",
]
dev = ["pytest", "pytest-cov", "pytest-timeout", "ipywidgets"]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo>=2024.0",
    "sphinx-copybutton>=0.5",
]
mcp = [
    "mcp[cli]>=1.29,<2",
]

[project.urls]
Homepage = "https://github.com/t-0hmura/mlmm_toolkit"
Repository = "https://github.com/t-0hmura/mlmm_toolkit"
Documentation = "https://t-0hmura.github.io/mlmm_toolkit/"
"Bug Tracker" = "https://github.com/t-0hmura/mlmm_toolkit/issues"

[project.scripts]
mlmm = "mlmm.cli:cli"
mlmm-mcp = "mlmm.mcp:serve"

[tool.pytest.ini_options]
testpaths = ["tests", "hessian_ff/tests"]
addopts = "-v --tb=short --timeout=120"
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests that require CUDA GPU (deselect with '-m \"not gpu\"')",
]

[tool.setuptools.dynamic]
version = {attr = "mlmm._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["mlmm*", "pysisyphus*", "thermoanalysis*", "hessian_ff*"]

[tool.setuptools.package-data]
mlmm = ["py.typed"]
hessian_ff = ["native/*.cpp", "native/Makefile"]
